services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nereid_scout
      POSTGRES_USER: nereid
      POSTGRES_PASSWORD: nereid_local_only
    ports:
      - "5432:5432"
    volumes:
      - scout_postgres_data:/var/lib/postgresql/data

volumes:
  scout_postgres_data:
